# Replace YOUR_GITHUB_NAME with your GitHub account before publishing.
format = 4
id = "github.com/YOUR_GITHUB_NAME/keystrokes-hud"
version = "0.1.0"

[info]
name = "Keystrokes HUD"
description = "WASD and SPACE overlay for Minecraft Bedrock Windows client."
tags = ["utility", "client"]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
# LeviLamina 26.60.7+ is format-4 client-capable.
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/keystrokes-hud-client-windows-x64.zip"]
place = [{ src = "keystrokes-hud/", dest = "mods/keystrokes-hud/" }]
